# Roda a cada envio de código: tipos, lint e todos os testes (inclusive os do
# banco, num Postgres embutido — nada aqui toca o Supabase de produção).
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx next lint
      - name: Testes (app + banco)
        run: npx vitest run
