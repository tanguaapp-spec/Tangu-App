<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Você está offline — Tanguá App</title>
  <style>
    :root { --fundo: #F4F6F1; --texto: #13241D; --apagado: #4F5F57; }
    @media (prefers-color-scheme: dark) {
      :root { --fundo: #0E1814; --texto: #EEF3F0; --apagado: #B3C0B9; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .cartao { max-width: 380px; }
    svg { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: var(--apagado); line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #F26A1B; color: #13241D; border: none; border-radius: 14px;
      min-height: 48px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="cartao">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 4C18 4 8 14.5 8 28c0 17 24 32 24 32s24-15 24-32C56 14.5 46 4 32 4z" fill="#1F7A55"/>
      <circle cx="32" cy="27" r="15" fill="#F26A1B"/>
      <circle cx="32" cy="27" r="3" fill="#FFE7D6"/>
    </svg>
    <h1>Você está sem internet</h1>
    <p>Essa página ainda não tinha sido carregada antes, então não dá pra abrir offline. Assim que a conexão voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
